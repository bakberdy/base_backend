[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI uses Depends, Query, and File calls as parameter defaults.
    "UP042", # Keep str + Enum compatible with the current Pydantic/FastAPI models.
    "UP046", # Keep Generic syntax until the model layer adopts PEP 695 consistently.
    "UP047", # Keep TypeVar overloads consistent with the current generic models.
]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
files = ["app", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that use real app wiring, database, ORM, or infrastructure",
]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning:starlette\\.formparsers",
]

[tool.babel.extractors]
python = "babel.messages.extract:extract_python"
