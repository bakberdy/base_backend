name: Terraform AWS

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "infra/aws/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to plan/apply"
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      apply:
        description: "Apply Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
  TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || vars.TF_ENVIRONMENT }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_instance_type: ${{ vars.TF_INSTANCE_TYPE }}
  TF_VAR_key_name: ${{ vars.TF_KEY_NAME }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.TF_ALLOWED_SSH_CIDR }}
  TF_VAR_vpc_cidr: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment == 'development' && vars.TF_DEVELOPMENT_VPC_CIDR || vars.TF_PRODUCTION_VPC_CIDR }}
  TF_VAR_domain_name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment == 'development' && vars.TF_DEVELOPMENT_DOMAIN_NAME || vars.TF_PRODUCTION_DOMAIN_NAME }}
  TF_VAR_certificate_email: ${{ vars.TF_CERTIFICATE_EMAIL }}
  TF_VAR_container_image: ghcr.io/${{ github.repository }}:latest

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Select Terraform workspace
        run: terraform workspace select "$TF_VAR_environment" || terraform workspace new "$TF_VAR_environment"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -auto-approve tfplan
