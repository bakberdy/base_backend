name: Deploy Backend to EC2

on:
  workflow_call:
    inputs:
      target_environment:
        description: "GitHub environment and EC2 target"
        required: true
        type: string
      source_sha:
        description: "Full source commit SHA represented by the image"
        required: true
        type: string
      image_reference:
        description: "Exact private ECR repository@sha256 reference"
        required: true
        type: string
      security_evidence_id:
        description: "Run-scoped content-addressed security evidence identifier"
        required: true
        type: string
    outputs:
      deployed_digest:
        description: "Digest that passed deployment health checks"
        value: ${{ jobs.deploy.outputs.deployed_digest }}
      previous_digest:
        description: "Digest running before this rollout"
        value: ${{ jobs.deploy.outputs.previous_digest }}
      deployment_status:
        description: "success, rolled_back, or rollback_failed"
        value: ${{ jobs.deploy.outputs.deployment_status }}
      ssm_command_id:
        description: "Initial rollout SSM command identifier"
        value: ${{ jobs.deploy.outputs.ssm_command_id }}
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true

  workflow_dispatch:
    inputs:
      target_environment:
        description: "EC2 environment to deploy"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      source_sha:
        description: "Full source SHA represented by the approved image"
        required: true
        type: string
      image_reference:
        description: "Exact ECR repository@sha256 reference"
        required: true
        type: string
      security_evidence_id:
        description: "run_id:run_attempt:sha256 evidence identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'mobile-app-backend' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}
    permissions:
      actions: read # Required to retrieve content-addressed evidence from its source run.
      contents: read
      id-token: write # Required for the short-lived AWS deployment role.
    outputs:
      deployed_digest: ${{ steps.result.outputs.deployed_digest }}
      previous_digest: ${{ steps.result.outputs.previous_digest }}
      deployment_status: ${{ steps.result.outputs.deployment_status }}
      ssm_command_id: ${{ steps.command.outputs.command_id }}

    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate immutable deployment contract
        id: contract
        env:
          CONFIGURED_ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          SECURITY_EVIDENCE_ID: ${{ inputs.security_evidence_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          case "${TARGET_ENVIRONMENT}" in
            development|production) ;;
            *)
              echo "::error::Unsupported target environment: ${TARGET_ENVIRONMENT}"
              exit 1
              ;;
          esac
          [[ "${PROJECT_NAME}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo "::error::PROJECT_NAME is invalid."
            exit 1
          }
          python3 tool/ci/deploy_policy.py \
            --source-sha "${SOURCE_SHA}" \
            --image-reference "${IMAGE_REFERENCE}" \
            --security-evidence-id "${SECURITY_EVIDENCE_ID}" \
            --github-output "${GITHUB_OUTPUT}"
          [[ "${IMAGE_REFERENCE}" == "${CONFIGURED_ECR_REPOSITORY_URI}"@* ]] || {
            echo "::error::image_reference does not belong to the configured ECR repository."
            exit 1
          }
          [[ "${INSTANCE_ID}" =~ ^i-[a-zA-Z0-9]+$ ]] || {
            echo "::error::EC2_INSTANCE_ID is missing or invalid."
            exit 1
          }
          [[ "${DEPLOY_HEALTH_URL}" =~ ^https?://[^[:space:]]+/health$ ]] || {
            echo "::error::DEPLOY_HEALTH_URL must be an HTTP(S) /health URL."
            exit 1
          }

      - name: Reject stale automatic deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          branch="development"
          if [[ "${TARGET_ENVIRONMENT}" == "production" ]]; then
            branch="main"
          fi
          current_sha="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" |
            jq --raw-output '.object.sha')"
          [[ "${current_sha}" == "${SOURCE_SHA}" ]] || {
            echo "::error::Stale deploy rejected: ${SOURCE_SHA} is not current ${branch} HEAD ${current_sha}."
            exit 1
          }

      - name: Download content-addressed security evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-security-evidence-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/security-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.contract.outputs.evidence_run_id }}

      - name: Verify stored security evidence
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          SECURITY_EVIDENCE_ID: ${{ inputs.security_evidence_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 tool/ci/deploy_policy.py \
            --source-sha "${SOURCE_SHA}" \
            --image-reference "${IMAGE_REFERENCE}" \
            --security-evidence-id "${SECURITY_EVIDENCE_ID}" \
            --evidence "${RUNNER_TEMP}/security-evidence/image-security-evidence.json"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Revalidate digest and managed signature
        env:
          IMAGE_DIGEST: ${{ steps.contract.outputs.image_digest }}
          REPOSITORY: ${{ steps.contract.outputs.repository }}
          SIGNING_PROFILE_ARN: ${{ vars.AWS_ECR_SIGNING_PROFILE_ARN }}
        run: |
          set -euo pipefail
          repository_name="${REPOSITORY#*/}"
          aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageDigest=${IMAGE_DIGEST}" \
            --query 'imageDetails[0].imageDigest' \
            --output text |
            grep --fixed-strings --line-regexp "${IMAGE_DIGEST}"
          signing_status="$(aws ecr describe-image-signing-status \
            --repository-name "${repository_name}" \
            --image-id "imageDigest=${IMAGE_DIGEST}" \
            --query "signingStatuses[?signingProfileArn=='${SIGNING_PROFILE_ARN}'].status | [0]" \
            --output text)"
          [[ "${signing_status}" == "COMPLETE" ]] || {
            echo "::error::Managed signature is not COMPLETE for ${IMAGE_DIGEST}."
            exit 1
          }

      - name: Send digest deployment to EC2
        id: command
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          app_directory="/opt/${PROJECT_NAME}-${TARGET_ENVIRONMENT}"
          tools_directory="${app_directory}/.deployment/tools"
          remote_directory="/tmp/${PROJECT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          compose_base64="$(base64 <docker-compose.yml | tr -d '\n')"
          nginx_base64="$(base64 <nginx/default.conf.template | tr -d '\n')"
          bootstrap_base64="$(base64 <deploy/ec2/bootstrap.sh | tr -d '\n')"
          rollout_base64="$(base64 <deploy/ec2/rollout.sh | tr -d '\n')"
          https_base64="$(base64 <deploy/ec2/enable_https.sh | tr -d '\n')"

          commands_json="$(jq -n \
            --arg app_directory "${app_directory}" \
            --arg aws_region "${AWS_REGION}" \
            --arg bootstrap_base64 "${bootstrap_base64}" \
            --arg compose_base64 "${compose_base64}" \
            --arg environment "${TARGET_ENVIRONMENT}" \
            --arg https_base64 "${https_base64}" \
            --arg image_reference "${IMAGE_REFERENCE}" \
            --arg nginx_base64 "${nginx_base64}" \
            --arg project_name "${PROJECT_NAME}" \
            --arg remote_directory "${remote_directory}" \
            --arg rollout_base64 "${rollout_base64}" \
            --arg tools_directory "${tools_directory}" \
            '{commands: [
              "set -euo pipefail",
              "mkdir -p " + $remote_directory + "/deploy/ec2 " + $remote_directory + "/nginx",
              "printf '\''%s'\'' " + $compose_base64 + " | base64 --decode > " + $remote_directory + "/docker-compose.yml",
              "printf '\''%s'\'' " + $nginx_base64 + " | base64 --decode > " + $remote_directory + "/nginx/default.conf.template",
              "printf '\''%s'\'' " + $bootstrap_base64 + " | base64 --decode > " + $remote_directory + "/deploy/ec2/bootstrap.sh",
              "printf '\''%s'\'' " + $rollout_base64 + " | base64 --decode > " + $remote_directory + "/deploy/ec2/rollout.sh",
              "printf '\''%s'\'' " + $https_base64 + " | base64 --decode > " + $remote_directory + "/deploy/ec2/enable_https.sh",
              "mkdir -p " + $tools_directory + "/deploy/ec2 " + $tools_directory + "/nginx",
              "cp -f " + $remote_directory + "/docker-compose.yml " + $tools_directory + "/docker-compose.yml",
              "cp -f " + $remote_directory + "/nginx/default.conf.template " + $tools_directory + "/nginx/default.conf.template",
              "cp -f " + $remote_directory + "/deploy/ec2/*.sh " + $tools_directory + "/deploy/ec2/",
              "chmod 0755 " + $tools_directory + "/deploy/ec2/*.sh",
              "rm -rf " + $remote_directory,
              "AWS_REGION=" + $aws_region + " PROJECT_NAME=" + $project_name + " bash " + $tools_directory + "/deploy/ec2/rollout.sh deploy " + $environment + " " + $image_reference,
              "install -m 0755 " + $tools_directory + "/deploy/ec2/enable_https.sh " + $app_directory + "/enable_https.sh"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy exact digest to ${TARGET_ENVIRONMENT}" \
            --parameters "${commands_json}" \
            --timeout-seconds 1200 \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${command_id}" >>"${GITHUB_OUTPUT}"
          echo "instance_id=${INSTANCE_ID}" >>"${GITHUB_OUTPUT}"

      - name: Wait for internal rollout
        id: rollout
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          INSTANCE_ID: ${{ steps.command.outputs.instance_id }}
        run: |
          set -euo pipefail
          rollout_status="timeout"
          output=""
          for _ in {1..120}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                output="$(aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text 2>/dev/null || true)"
                if [[ "${status}" == "Success" ]] && grep -q '^DEPLOYMENT_STATUS=success$' <<<"${output}"; then
                  rollout_status="success"
                else
                  rollout_status="failed"
                fi
                break
                ;;
              Pending|InProgress|Delayed|"") sleep 5 ;;
              *) rollout_status="failed"; break ;;
            esac
          done
          previous_image="$(sed -n 's/^PREVIOUS_IMAGE=//p' <<<"${output}" | tail -1)"
          echo "rollout_status=${rollout_status}" >>"${GITHUB_OUTPUT}"
          echo "previous_image=${previous_image}" >>"${GITHUB_OUTPUT}"
          printf '%s\n' "${output}"

      - name: Verify external health
        id: external
        if: steps.rollout.outputs.rollout_status == 'success'
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: curl --fail --silent --show-error --location --retry 6 --retry-all-errors --max-time 10 "${HEALTH_URL}"

      - name: Roll back after failed health
        id: rollback
        if: steps.rollout.outputs.rollout_status != 'success' || steps.external.outcome != 'success'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PREVIOUS_IMAGE: ${{ steps.rollout.outputs.previous_image }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          [[ "${PREVIOUS_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo "rollback_status=failed" >>"${GITHUB_OUTPUT}"
            echo "::error::No valid previous digest is available for rollback."
            exit 0
          }
          rollout_script="/opt/${PROJECT_NAME}-${TARGET_ENVIRONMENT}/.deployment/tools/deploy/ec2/rollout.sh"
          commands_json="$(jq -n \
            --arg aws_region "${AWS_REGION}" \
            --arg environment "${TARGET_ENVIRONMENT}" \
            --arg image_reference "${PREVIOUS_IMAGE}" \
            --arg project_name "${PROJECT_NAME}" \
            --arg rollout_script "${rollout_script}" \
            '{commands: [
              "set -euo pipefail",
              "AWS_REGION=" + $aws_region + " PROJECT_NAME=" + $project_name + " bash " + $rollout_script + " rollback " + $environment + " " + $image_reference
            ]}')"
          rollback_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback ${TARGET_ENVIRONMENT} to previous digest" \
            --parameters "${commands_json}" \
            --timeout-seconds 1200 \
            --query 'Command.CommandId' \
            --output text)"
          rollback_status="failed"
          for _ in {1..120}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${rollback_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success) rollback_status="success"; break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
              Pending|InProgress|Delayed|"") sleep 5 ;;
              *) break ;;
            esac
          done
          echo "rollback_status=${rollback_status}" >>"${GITHUB_OUTPUT}"

      - name: Set deployment result
        id: result
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.contract.outputs.image_digest }}
          PREVIOUS_IMAGE: ${{ steps.rollout.outputs.previous_image }}
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.rollback_status }}
          ROLLOUT_STATUS: ${{ steps.rollout.outputs.rollout_status }}
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
        run: |
          set -euo pipefail
          previous_digest="${PREVIOUS_IMAGE##*@}"
          echo "previous_digest=${previous_digest}" >>"${GITHUB_OUTPUT}"
          if [[ "${ROLLOUT_STATUS}" == "success" && "${EXTERNAL_OUTCOME}" == "success" ]]; then
            echo "deployed_digest=${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"
            echo "deployment_status=success" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${ROLLBACK_STATUS}" == "success" ]]; then
            echo "deployed_digest=${previous_digest}" >>"${GITHUB_OUTPUT}"
            echo "deployment_status=rolled_back" >>"${GITHUB_OUTPUT}"
            echo "::error::Deployment health failed and the previous digest was restored."
            exit 1
          fi
          echo "deployed_digest=" >>"${GITHUB_OUTPUT}"
          echo "deployment_status=rollback_failed" >>"${GITHUB_OUTPUT}"
          echo "::error::Deployment and automatic rollback failed."
          exit 1
