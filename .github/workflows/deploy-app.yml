name: Deploy Backend to EC2

on:
  workflow_call:
    inputs:
      target_environment:
        description: "GitHub environment and EC2 target"
        required: true
        type: string
      image_tag:
        description: "Immutable GHCR image tag"
        required: true
        type: string
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: true

  workflow_dispatch:
    inputs:
      target_environment:
        description: "EC2 environment to deploy"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      image_tag:
        description: "GHCR image tag, for example sha-<full-commit-sha>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'mobile-app-backend' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          case "${TARGET_ENVIRONMENT}" in
            development|production) ;;
            *)
              echo "::error::Unsupported target environment: ${TARGET_ENVIRONMENT}"
              exit 1
              ;;
          esac
          [[ "${PROJECT_NAME}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo "::error::PROJECT_NAME may contain only lowercase letters, digits, and hyphens."
            exit 1
          }
          [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Image tag contains unsupported characters."
            exit 1
          }
          test -n "${AWS_REGION}" || {
            echo "::error::AWS_REGION repository variable is not configured."
            exit 1
          }
          [[ "${INSTANCE_ID}" =~ ^i-[a-zA-Z0-9]+$ ]] || {
            echo "::error::EC2_INSTANCE_ID is missing or invalid in the ${TARGET_ENVIRONMENT} GitHub environment."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment to EC2
        id: command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          app_directory="/opt/${PROJECT_NAME}-${TARGET_ENVIRONMENT}"
          container_image="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          remote_directory="/tmp/${PROJECT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          compose_base64="$(base64 <docker-compose.yml | tr -d '\n')"
          nginx_base64="$(base64 <nginx/default.conf.template | tr -d '\n')"
          bootstrap_base64="$(base64 <deploy/ec2/bootstrap.sh | tr -d '\n')"
          https_base64="$(base64 <deploy/ec2/enable_https.sh | tr -d '\n')"

          commands_json="$(jq -n \
            --arg app_directory "${app_directory}" \
            --arg bootstrap_base64 "${bootstrap_base64}" \
            --arg compose_base64 "${compose_base64}" \
            --arg container_image "${container_image}" \
            --arg environment "${TARGET_ENVIRONMENT}" \
            --arg https_base64 "${https_base64}" \
            --arg nginx_base64 "${nginx_base64}" \
            --arg project_name "${PROJECT_NAME}" \
            --arg remote_directory "${remote_directory}" \
            '{commands: [
              "set -euo pipefail",
              "mkdir -p " + $remote_directory + "/deploy/ec2 " + $remote_directory + "/nginx",
              "printf '\''%s'\'' " + $compose_base64 + " | base64 --decode > " + $remote_directory + "/docker-compose.yml",
              "printf '\''%s'\'' " + $nginx_base64 + " | base64 --decode > " + $remote_directory + "/nginx/default.conf.template",
              "printf '\''%s'\'' " + $bootstrap_base64 + " | base64 --decode > " + $remote_directory + "/deploy/ec2/bootstrap.sh",
              "printf '\''%s'\'' " + $https_base64 + " | base64 --decode > " + $remote_directory + "/deploy/ec2/enable_https.sh",
              "chmod 0755 " + $remote_directory + "/deploy/ec2/*.sh",
              "PROJECT_NAME=" + $project_name + " bash " + $remote_directory + "/deploy/ec2/bootstrap.sh " + $environment + " " + $container_image,
              "install -m 0755 " + $remote_directory + "/deploy/ec2/enable_https.sh " + $app_directory + "/enable_https.sh",
              "rm -rf " + $remote_directory,
              "cd " + $app_directory,
              "for attempt in $(seq 1 30); do docker compose exec -T app python -c \"from urllib.request import urlopen; urlopen('\''http://127.0.0.1:8000/health'\'', timeout=3)\" && exit 0; sleep 2; done",
              "docker compose logs --tail=100 app",
              "exit 1"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${container_image} to ${TARGET_ENVIRONMENT}" \
            --parameters "${commands_json}" \
            --timeout-seconds 1200 \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${command_id}" >>"${GITHUB_OUTPUT}"
          echo "instance_id=${INSTANCE_ID}" >>"${GITHUB_OUTPUT}"
          echo "Deploying ${container_image} to ${TARGET_ENVIRONMENT} (${INSTANCE_ID})."

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          INSTANCE_ID: ${{ steps.command.outputs.instance_id }}
        run: |
          set -euo pipefail
          for _ in {1..120}; do
            status="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "${status}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output text
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "::error::Unexpected SSM command status: ${status}"
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment timed out while waiting for SSM command ${COMMAND_ID}."
          exit 1
