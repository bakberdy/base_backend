name: Repository Security

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Full source commit SHA"
        required: true
        type: string
      upload_sarif:
        description: "Whether trusted-context SARIF upload is allowed"
        required: true
        type: boolean
    outputs:
      status:
        description: "Repository security result"
        value: ${{ jobs.repository-security-gate.outputs.status }}
      report_id:
        description: "Run-scoped security report identifier"
        value: ${{ jobs.repository-security-gate.outputs.report_id }}

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked sensitive or local files
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [[ -n "${tracked_ignored}" ]]; then
            echo "::error::Files matched by .gitignore are already tracked:"
            printf '%s\n' "${tracked_ignored}"
            echo "::error::Remove them from the Git index before merging."
            exit 1
          fi

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks

      - name: Scan repository for secrets
        run: >
          "${RUNNER_TEMP}/gitleaks" git
          --redact
          --no-banner
          --verbose
          .

  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit dependency manifest
        run: python tool/ci/dependency_audit.py requirements.txt

      - name: Record dependency evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: printf '### Dependency audit passed for `%s`\n' "${SOURCE_SHA}" >>"${GITHUB_STEP_SUMMARY}"

  workflows:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_x86_64.tar.gz" \
            --output "${actionlint_archive}"
          echo "${ACTIONLINT_SHA256}  ${actionlint_archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar --extract --gzip --file "${actionlint_archive}" --directory "${RUNNER_TEMP}/actionlint"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate workflow syntax and expressions
        run: |
          "${RUNNER_TEMP}/actionlint/actionlint" -color .github/workflows/*.yml

      - name: Enforce workflow security policy
        env:
          ZIZMOR_VERSION: 1.28.0
        run: uvx "zizmor@${ZIZMOR_VERSION}" --persona pedantic .github/workflows

      - name: Record workflow evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: printf '### actionlint and zizmor passed for `%s`\n' "${SOURCE_SHA}" >>"${GITHUB_STEP_SUMMARY}"

  configuration:
    name: Configuration Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Validate expiring security exceptions
        run: python3 tool/ci/security_exceptions.py validate

      - name: Install pinned configuration scanner
        env:
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
          TRIVY_VERSION: 0.72.0
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/trivy"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}/trivy"

      - name: Build path-scoped Trivy exception file
        run: python3 tool/ci/security_exceptions.py trivy-ignore "${RUNNER_TEMP}/trivy-ignore.yaml"

      - name: Validate Docker Compose security policy
        run: make PYTHON=python3 compose-check

      - name: Scan Docker and Terraform configuration
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
        run: |
          "${RUNNER_TEMP}/trivy/trivy" config \
            --cache-dir "${RUNNER_TEMP}/trivy-cache" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignorefile "${RUNNER_TEMP}/trivy-ignore.yaml" \
            --skip-dirs .venv \
            .

      - name: Record configuration evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: printf '### Trivy configuration policy passed for `%s`\n' "${SOURCE_SHA}" >>"${GITHUB_STEP_SUMMARY}"

  repository-security-gate:
    name: Repository Security Gate
    if: always()
    needs:
      - secrets
      - dependencies
      - workflows
      - configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.result.outputs.status }}
      report_id: ${{ steps.result.outputs.report_id }}
    steps:
      - name: Require all repository security checks
        id: result
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          if [[ "${SECRETS_RESULT}" != "success" ||
                "${DEPENDENCIES_RESULT}" != "success" ||
                "${WORKFLOWS_RESULT}" != "success" ||
                "${CONFIGURATION_RESULT}" != "success" ]]; then
            echo "::error::Repository security checks did not all succeed."
            exit 1
          fi
          echo "status=success" >>"${GITHUB_OUTPUT}"
          echo "report_id=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
