name: Publish Backend Image

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    uses: ./.github/workflows/project-validation.yml
    with:
      source_sha: ${{ github.sha }}

  repository-security:
    uses: ./.github/workflows/repository-security.yml
    with:
      source_sha: ${{ github.sha }}
      upload_sarif: false

  container:
    needs:
      - validate
      - repository-security
    permissions:
      contents: read
      id-token: write # Passed to the reusable ECR publish workflow for AWS OIDC.
    uses: ./.github/workflows/container-image.yml
    with:
      mode: release
      source_sha: ${{ github.sha }}
      platform: linux/amd64
      repository_uri: ${{ vars.ECR_REPOSITORY_URI }}
